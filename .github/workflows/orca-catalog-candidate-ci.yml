name: Catalog candidate verification

on:
  push:
    branches:
      - ci/catalog-candidate-20261017

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAKEFLAGS: '-j2'
      npm_config_jobs: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: yasyf/orca
          ref: 5b9b33b738ee31afed6fc066160b78c427939637
          fetch-depth: 1
          persist-credentials: false
      - name: Verify candidate identity
        run: test "$(git rev-parse HEAD)" = 5b9b33b738ee31afed6fc066160b78c427939637
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-pnpm-store: 'false'
      - name: Check changed-file formatting
        id: formatting
        continue-on-error: true
        run: >-
          pnpm exec oxfmt --check
          src/main/runtime/construction/runtime-construction-services.ts
          src/main/runtime/construction/runtime-service-state.ts
          src/main/runtime/runtime-resolved-worktree-cache.test.ts
          src/main/runtime/runtime-resolved-worktree-cache.ts
          src/main/runtime/sidebar-inputs/orca-runtime-workspace-review-facts.test.ts
          src/main/runtime/workspaces/workspace-catalog.ts
          src/main/runtime/workspaces/workspace-process-listing-dependencies.ts
          src/main/runtime/workspaces/workspace-process-listing.ts
          src/main/runtime/workspaces/workspace-query-prototype.test.ts
          src/main/runtime/worktree-ps-degraded-repo-scan.test.ts
      - name: Typecheck Node runtime
        run: pnpm run tc:node
      - name: Exercise catalog, selector, cache and host ownership regressions
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts --project node --maxWorkers=2
          src/main/runtime/worktree-ps-degraded-repo-scan.test.ts
          src/main/runtime/runtime-resolved-worktree-cache.test.ts
          src/main/runtime/repo-worktree-row-resolution.test.ts
          src/main/runtime/runtime-managed-worktree-queries.test.ts
          src/main/runtime/worktree-list-host-scope.test.ts
          src/main/runtime/worktree-ps-host-scope.test.ts
          src/main/runtime/worktree-scan-admin-fingerprint-gate.test.ts
          src/main/runtime/workspaces/workspace-query-prototype.test.ts
          src/main/runtime/sidebar-inputs/orca-runtime-workspace-review-facts.test.ts
      - name: Save formatter corrections
        if: always() && steps.formatting.outcome == 'failure'
        run: |
          pnpm exec oxfmt --write src/main/runtime/construction/runtime-construction-services.ts src/main/runtime/construction/runtime-service-state.ts src/main/runtime/runtime-resolved-worktree-cache.test.ts src/main/runtime/runtime-resolved-worktree-cache.ts src/main/runtime/sidebar-inputs/orca-runtime-workspace-review-facts.test.ts src/main/runtime/workspaces/workspace-catalog.ts src/main/runtime/workspaces/workspace-process-listing-dependencies.ts src/main/runtime/workspaces/workspace-process-listing.ts src/main/runtime/workspaces/workspace-query-prototype.test.ts src/main/runtime/worktree-ps-degraded-repo-scan.test.ts
          git diff > catalog-formatting.patch
      - uses: actions/upload-artifact@v4
        if: always() && steps.formatting.outcome == 'failure'
        with:
          name: catalog-formatting-patch
          path: catalog-formatting.patch
      - name: Require formatting success
        if: steps.formatting.outcome == 'failure'
        run: exit 1
